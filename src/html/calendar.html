<!-- Notas:
    Basicamente HTML/CSS + JS, um navegador Chrome;
    É isolado e não deve conseguir ler arquivos do computador ou rodar comandos do sistema;
    Gerencia a interface e as ações dos botões; -->

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>FocusFlow - macOS Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Remove as setinhas padrão do input de número se necessário */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-[#ececec] flex items-center justify-center h-screen font-sans select-none overflow-hidden">

    <div
        class="bg-white/60 backdrop-blur-2xl p-8 rounded-[40px] shadow-[0_20px_60px_rgba(0,0,0,0.1)] border border-white/40 text-center w-[400px] transition-all hover:scale-[1.01]">

        <div class="flex justify-between items-center mb-6">
            <button id="last-month" class="text-gray-500 hover:text-[#007AFF] transition-colors p-2">
                &lt; </button>

            <h2 id="current-month" class="text-xl font-bold text-gray-800 uppercase tracking-widest">
                JANEIRO 2026
            </h2>

            <button id="next-month" class="text-gray-500 hover:text-[#007AFF] transition-colors p-2">
                &gt; </button>
        </div>

        <div class="grid grid-cols-7 gap-1 mb-2">
            <div class="text-xs font-bold text-gray-400 uppercase">Dom</div>
            <div class="text-xs font-bold text-gray-400 uppercase">Seg</div>
            <div class="text-xs font-bold text-gray-400 uppercase">Ter</div>
            <div class="text-xs font-bold text-gray-400 uppercase">Qua</div>
            <div class="text-xs font-bold text-gray-400 uppercase">Qui</div>
            <div class="text-xs font-bold text-gray-400 uppercase">Sex</div>
            <div class="text-xs font-bold text-gray-400 uppercase">Sab</div>
        </div>

        <div id="calendar-grid" class="grid grid-cols-7 gap-1">

            <span></span>
            <span></span>

            <button
                class="h-10 w-10 flex items-center justify-center rounded-full text-gray-700 hover:bg-blue-100 hover:text-[#007AFF] transition-all text-sm">1</button>
            <button
                class="h-10 w-10 flex items-center justify-center rounded-full text-gray-700 hover:bg-blue-100 hover:text-[#007AFF] transition-all text-sm">2</button>

            <button
                class="h-10 w-10 flex items-center justify-center rounded-full bg-[#007AFF] text-white shadow-md shadow-blue-500/30 text-sm font-bold">3</button>

            <button
                class="h-10 w-10 flex items-center justify-center rounded-full text-gray-700 hover:bg-blue-100 hover:text-[#007AFF] transition-all text-sm">4</button>
        </div>

    </div>

    <div id="task-sidebar"
        class="fixed top-0 right-0 h-full w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">

        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
            <div>
                <h2 class="text-xl font-bold text-gray-800">Tarefas</h2>
                <p id="sidebar-date-label" class="text-sm text-blue-600 font-medium">Selecione um dia</p>
            </div>
            <button id="close-sidebar"
                class="text-gray-400 hover:text-gray-600 hover:bg-gray-200 p-2 rounded-full transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
            <ul id="task-list" class="space-y-3">
            </ul>
        </div>

        <div class="p-6 border-t border-gray-100 bg-gray-50">
            <div class="flex gap-2">
                <input type="text" id="task-input" placeholder="Nova tarefa..."
                    class="flex-1 px-4 py-2 rounded-xl bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-sm">
                <button id="add-task-btn"
                    class="bg-[#007AFF] hover:bg-blue-600 text-white p-2 rounded-xl transition-all shadow-lg shadow-blue-500/30 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="sidebar-overlay"
        class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 hidden transition-opacity opacity-0"></div>

    <script type="module" src="../js/calendar.js"></script>
</body>

</html>

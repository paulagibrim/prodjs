<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Prodjs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Remove a borda padrão do iframe */
        iframe {
            border: none;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex overflow-hidden font-sans select-none">

    <nav class="w-45 bg-white border-r border-gray-200 flex flex-col p-6 shadow-lg z-10">

        <h1 class="text-2xl font-bold text-gray-800 mb-10 tracking-tight">
            Prod<span class="text-[#007AFF]">js</span>
        </h1>

        <div class="space-y-4 flex-1">

            <button id="nav-timer"
                class="w-full flex items-center gap-4 px-4 py-3 text-left text-[#007AFF] bg-blue-50 rounded-xl font-medium transition-all hover:bg-blue-100">
                <span>⏱️</span> Timer
            </button>

            <button id="nav-calendar"
                class="w-full flex items-center gap-4 px-4 py-3 text-left text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-xl font-medium transition-all">
                <span>📅</span> Calendário
            </button>

        </div>

        <div class="text-xs text-gray-400 mt-auto text-center">
            v1.0 MVP
        </div>
    </nav>

    <main class="flex-1 relative bg-[#ececec]">
        <iframe id="app-frame" src="timer.html" class="w-full h-full absolute top-0 left-0"></iframe>
    </main>

    <script src="../js/index.js"></script>
</body>

</html>

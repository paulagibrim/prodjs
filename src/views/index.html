<!-- Notas:
    Basicamente HTML/CSS + JS, um navegador Chrome;
    É isolado e não deve conseguir ler arquivos do computador ou rodar comandos do sistema;
    Gerencia a interface e as ações dos botões; -->

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>FocusFlow - macOS Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Remove as setinhas padrão do input de número se necessário */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-[#ececec] flex items-center justify-center h-screen font-sans select-none overflow-hidden">

    <div
        class="bg-white/60 backdrop-blur-2xl p-12 rounded-[50px] shadow-[0_20px_60px_rgba(0,0,0,0.1)] border border-white/40 text-center w-[400px] transition-all hover:scale-[1.01]">

        <h2 class="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-400 mb-10">Focus Time</h2>

        <div class="bg-gray-200/50 p-1 rounded-full flex mb-8 relative">

            <button id="mode-stopwatch"
                class="w-1/2 bg-white text-gray-800 rounded-full py-2 text-sm font-semibold shadow-sm transition-all">
                Stopwatch
            </button>

            <button id="mode-timer"
                class="w-1/2 text-gray-500 hover:text-gray-700 rounded-full py-2 text-sm font-medium transition-all">
                Timer
            </button>

        </div>

        <div class="flex justify-center mb-12">
            <button id="clock-timer"
                class="bg-transparent text-8xl font-medium text-gray-800 tabular-nums text-center w-full outline-none focus:text-[#007AFF] transition-colors cursor-text hover:bg-gray-200/20 rounded-2xl p-2">00:00</button>
        </div>

        <div class="flex gap-4 w-full">
            <button id="start-btn"
                class="flex-1 bg-[#007AFF] text-white px-8 py-4 rounded-2xl font-semibold shadow-lg shadow-blue-500/30 hover:bg-[#0063cc] active:scale-95 transition-all text-lg">
                Start
            </button>

            <button id="reset-btn"
                class="bg-gray-200/80 text-gray-700 px-6 py-4 rounded-2xl font-semibold hover:bg-gray-300 active:scale-95 transition-all">
                <span class="text-xl">↺</span>
            </button>
        </div>
    </div>

    <script src="../js/timer.js"></script>
</body>

</html>
